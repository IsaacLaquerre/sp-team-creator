<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Équipe de projet</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2530;--mute:#5d6b7a;--line:#d3dae1;--accent:#1f5f8b;--accent-ink:#fff;--ok:#1d7a4a;--err:#b3261e;--field:#f7f9fb;--thumb:rgba(0,0,0,.28);--thumb-hover:rgba(0,0,0,.42);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171c;--card:#1b222a;--ink:#e6ebf0;--mute:#93a1b0;--line:#2e3944;--accent:#5aa9dc;--accent-ink:#0c1620;--ok:#5fcf93;--err:#ff8a80;--field:#151b21;--thumb:rgba(255,255,255,.28);--thumb-hover:rgba(255,255,255,.42);color-scheme:dark}}
:root[data-theme=dark]{--bg:#12171c;--card:#1b222a;--ink:#e6ebf0;--mute:#93a1b0;--line:#2e3944;--accent:#5aa9dc;--accent-ink:#0c1620;--ok:#5fcf93;--err:#ff8a80;--field:#151b21;--thumb:rgba(255,255,255,.28);--thumb-hover:rgba(255,255,255,.42);color-scheme:dark}
*{box-sizing:border-box}

/* Safari-style scrollbar: transparent track, thin floating rounded thumb */
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
*::-webkit-scrollbar{width:8px;height:8px;background:transparent}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background-color:var(--thumb);background-clip:padding-box;border:2px solid transparent;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background-color:var(--thumb-hover)}

body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:start center;padding:20px}
main{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;position:relative;margin-top:20px}
h1{font-size:21px;margin:0 0 18px;padding-right:44px;letter-spacing:-.01em}
label{display:block;font-weight:600;margin:0 0 4px}
.hint{color:var(--mute);font-weight:400}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{margin-bottom:16px}
.row-split{display:flex;gap:10px}
.field-num{flex:0 0 64px}
.field-ttl{flex:1;min-width:0}
.preview{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:22px 0;color:var(--mute);font-size:13.5px}
.preview b{display:block;color:var(--ink);font-weight:600;word-break:break-all}
.preview div+div{margin-top:8px}
button.primary{width:100%;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:11px;cursor:pointer}
button.primary:disabled{opacity:.55;cursor:default}
#gear{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;font-size:17px;line-height:1}
#settings{display:none;position:absolute;top:58px;right:18px;width:220px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:2}
#settings.open{display:block}
#settings .row:last-child{margin-bottom:0}
#msg{margin-top:16px;min-height:22px;font-size:14px}
#msg.ok{color:var(--ok)}#msg.err{color:var(--err)}
#teamifyMsg.err{color:var(--err)}
#membersMsg.err{color:var(--err)}
#msg a{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
#overlay{display:none;position:fixed;inset:0;background:rgba(10,14,18,.55);place-items:center;z-index:10;padding:20px}
#overlay.open{display:grid}
#consent{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
#consent h2{margin:0 0 12px;font-size:18px}
#consent p{margin:0 0 10px;color:var(--mute);font-size:14px}
#consent ul{margin:0 0 18px;padding-left:20px;color:var(--mute);font-size:14px}
#consent li{margin-bottom:5px}
#consent li b{color:var(--ink);font-weight:600}
.consent-actions{display:flex;gap:10px}
.consent-actions button{flex:1;font:inherit;font-weight:600;border-radius:6px;padding:10px;cursor:pointer}
#consentAgree{background:var(--accent);color:var(--accent-ink);border:0}
#consentDecline{background:var(--field);color:var(--ink);border:1px solid var(--line)}

#updateOverlay{display:none;position:fixed;inset:0;background:rgba(10,14,18,.55);place-items:center;z-index:11;padding:20px}
#updateOverlay.open{display:grid}
#updateDialog{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
#updateDialog h2{margin:0 0 12px;font-size:18px}
#updateDialog p{margin:0 0 14px;color:var(--mute);font-size:14px}
#updateLink{display:inline-block;margin-bottom:18px;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.settings-btn{width:100%;font:inherit;font-weight:600;font-size:13.5px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;cursor:pointer;margin-top:12px}
.settings-btn:hover{border-color:var(--accent)}
.settings-btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.settings-btn.accent:hover{filter:brightness(1.08)}
#settings .row:last-of-type{margin-bottom:0}
#adminOverlay{display:none;position:fixed;inset:0;background:rgba(10,14,18,.55);place-items:center;z-index:11;padding:20px}
#adminOverlay.open{display:grid}
#adminDialog{width:100%;max-width:860px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.admin-head h2{margin:0;font-size:18px}
.admin-actions{display:flex;gap:6px}
.admin-table-wrap{overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px}
#adminTable{width:100%;border-collapse:collapse;font-size:13px}
#adminTable th{position:sticky;top:0;background:var(--field);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
#adminTable td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
#adminTable tr:last-child td{border-bottom:0}
#adminTable td.old{color:var(--err);font-weight:600}
.update-actions{display:flex;gap:10px}
.update-actions button{flex:1;font:inherit;font-weight:600;border-radius:6px;padding:10px;cursor:pointer}
#updateRestart{background:var(--accent);color:var(--accent-ink);border:0}
#updateLater{background:var(--field);color:var(--ink);border:1px solid var(--line)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 22px;padding-right:44px}
.tab{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 2px;margin-right:18px;cursor:pointer}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:none}
.view.active{display:block}

.owners-field,.members-field{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips:empty{margin-bottom:0}
.chip{display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px}
.chip button{font:inherit;line-height:1;background:none;border:0;color:var(--mute);cursor:pointer;padding:0 2px}
.chip button:hover{color:var(--err)}
#ownerResults{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:220px;overflow:auto;z-index:3}
#ownerResults.open{display:block}
.result{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 11px;cursor:pointer;color:var(--ink)}
.result:last-child{border-bottom:0}
.result:hover,.result:focus-visible{background:var(--field)}
.result .rname{font-weight:600;display:block}
.result .remail{color:var(--mute);font-size:12.5px}
.result.empty{color:var(--mute);cursor:default}

.hist-empty{color:var(--mute);font-size:14px;padding:6px 0}
.hist-list{display:flex;flex-direction:column;gap:10px}
.hist-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:8px}
.hist-main{flex:1;min-width:0}
.hist-title{font-weight:600;word-break:break-word}
.hist-meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.hist-open{font:inherit;font-weight:600;font-size:13px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.hist-open:disabled{opacity:.5;cursor:default}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:16px;height:16px}
.icon-btn:disabled{opacity:.5;cursor:default}
.icon-btn.danger{color:var(--err);border-color:var(--err)}
.icon-btn.danger:hover{background:var(--err);color:#fff}
.icon-btn.sync:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px}
.hist-head h1{margin:0;padding-right:0}
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:13px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px 6px 11px;cursor:pointer;white-space:nowrap}
.dd-btn svg{width:15px;height:15px;color:var(--mute);transition:transform .15s}
.dd-btn:hover,.dd-btn[aria-expanded=true]{border-color:var(--accent)}
.dd-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:3}
.dd-menu.open{display:block}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;font:inherit;font-size:13.5px;background:none;border:0;border-radius:5px;padding:7px 9px;color:var(--ink);cursor:pointer;white-space:nowrap}
.dd-opt:hover,.dd-opt:focus-visible{background:var(--field);outline:none}
.dd-opt[aria-selected=true]{color:var(--accent);font-weight:600}
.dd-opt svg{width:15px;height:15px;visibility:hidden}
.dd-opt[aria-selected=true] svg{visibility:visible}
.icon-btn.pin{visibility:hidden}
.hist-item:hover .icon-btn.pin,.icon-btn.pin:focus-visible,.icon-btn.pin.on{visibility:visible}
.icon-btn.pin.on{color:var(--accent);border-color:var(--accent)}
.icon-btn.pin:hover{border-color:var(--accent)}

/* Wide layout: both panels side by side as cards, no tabs. 1134px viewport is about a 1150px window. */
@media (min-width:1134px){
  body{height:100vh;overflow:hidden}
  main{max-width:1000px;height:calc(100vh - 60px);background:none;border:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .tabs{display:none}
  .view,.view.active{display:block;max-height:100%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
  #viewCreate h1{padding-right:0}
  #gear{position:fixed;top:16px;right:16px;z-index:4}
  #settings{position:fixed;top:56px;right:16px;z-index:4}
}
</style>
</head>
<body>
<main>
  <button id="gear" type="button" aria-haspopup="true" aria-expanded="false">⚙</button>
  <div id="settings" role="dialog">
    <div class="row"><label for="lang" data-i="language"></label>
      <select id="lang"><option value="system" data-i="system"></option><option value="fr">Français</option><option value="en">English</option></select></div>
    <div class="row"><label for="theme" data-i="theme"></label>
      <select id="theme"><option value="system" data-i="system"></option><option value="light" data-i="light"></option><option value="dark" data-i="dark"></option></select></div>
    <button id="updateNow" type="button" class="settings-btn accent" hidden></button>
    <button id="adminOpen" type="button" class="settings-btn" data-i="adminOpen" hidden></button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabCreateBtn" type="button" data-i="createTab"></button>
    <button class="tab" id="tabHistoryBtn" type="button" data-i="sitesTab"></button>
  </div>

  <div id="viewCreate" class="view active">
    <h1 data-i="heading"></h1>
    <form id="f" novalidate>
      <div class="row row-split">
        <div class="field-num"><label for="num"><span data-i="number"></span></label>
          <input id="num" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="430" autofocus></div>
        <div class="field-ttl"><label for="ttl"><span data-i="title"></span></label>
          <input id="ttl" autocomplete="off" placeholder="Pont de Québec (tablier)"></div>
      </div>
      <div class="row owners-field">
        <label for="ownerInput"><span data-i="owners"></span></label>
        <div class="chips" id="ownerChips"></div>
        <input id="ownerInput" autocomplete="off">
        <div id="ownerResults" role="listbox"></div>
      </div>
      <div class="row members-field">
        <label for="memberInput"><span data-i="members"></span></label>
        <div class="chips" id="memberChips"></div>
        <input id="memberInput" autocomplete="off">
        <div id="memberResults" role="listbox"></div>
      </div>
      <div class="preview">
        <div><span data-i="teamName"></span><b id="pName">—</b></div>
        <div><span data-i="alias"></span><b id="pAlias">—</b></div>
      </div>
      <button class="primary" id="go" type="submit"></button>
      <div id="msg" role="status" aria-live="polite"></div>
      <div id="teamifyMsg" role="status" aria-live="polite" class="hist-meta" style="margin-top:4px"></div>
      <div id="membersMsg" role="status" aria-live="polite" class="hist-meta" style="margin-top:4px"></div>
    </form>
  </div>

  <div id="viewHistory" class="view">
    <div class="hist-head">
      <h1 data-i="sitesTab"></h1>
      <div class="dd">
        <button id="histSort" type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="histSortMenu">
          <span id="histSortLabel"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="histSortMenu" class="dd-menu" role="listbox"></div>
      </div>
    </div>
    <div id="histEmpty" class="hist-empty" data-i="historyEmpty"></div>
    <div id="histList" class="hist-list"></div>
  </div>
</main>

<div id="overlay" role="presentation">
  <div id="consent" role="dialog" aria-modal="true" aria-labelledby="consentTitle">
    <h2 id="consentTitle" data-i="consentTitle"></h2>
    <p data-i="consentIntro"></p>
    <ul>
      <li><b data-i="consentItem1Title"></b> — <span data-i="consentItem1"></span></li>
      <li><b data-i="consentItem2Title"></b> — <span data-i="consentItem2"></span></li>
      <li><b data-i="consentItem3Title"></b> — <span data-i="consentItem3"></span></li>
    </ul>
    <div class="consent-actions">
      <button id="consentDecline" type="button" data-i="consentDecline"></button>
      <button id="consentAgree" type="button" data-i="consentAgree"></button>
    </div>
  </div>
</div>

<div id="adminOverlay" role="presentation">
  <div id="adminDialog" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="admin-head">
      <h2 id="adminTitle" data-i="adminTitle"></h2>
      <div class="admin-actions">
        <button id="adminRefresh" type="button" class="dd-btn" data-i="adminRefresh"></button>
        <button id="adminClose" type="button" class="dd-btn" data-i="adminClose"></button>
      </div>
    </div>
    <div id="adminStatus" class="hist-meta"></div>
    <div class="admin-table-wrap">
      <table id="adminTable">
        <thead><tr><th data-i="adminName"></th><th data-i="adminEmail"></th><th data-i="adminRole"></th><th data-i="adminComputer"></th><th data-i="adminVersion"></th><th data-i="adminLastSeen"></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div id="updateOverlay" role="presentation">
  <div id="updateDialog" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
    <h2 id="updateTitle" data-i="updateTitle"></h2>
    <p id="updateBody"></p>
    <a id="updateLink" data-i="updateLink"></a>
    <div class="update-actions">
      <button id="updateLater" type="button" data-i="updateLater"></button>
      <button id="updateRestart" type="button" data-i="updateRestart"></button>
    </div>
  </div>
</div>

<script>
const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';

// One factory, two instances (owners, members). list is mutated in place.
// Picking someone already in otherList moves them out of it.
function makePicker(list, ids, otherList){
  let seq = 0;
  function render(){
    const box = $(ids.chips);
    box.textContent = '';
    list.forEach((p, i) => {
      const chip = document.createElement('span'); chip.className = 'chip';
      const label = document.createElement('span'); label.textContent = p.name || p.email;
      const rm = document.createElement('button'); rm.type = 'button'; rm.textContent = '×'; rm.title = p.email;
      rm.addEventListener('click', () => { list.splice(i, 1); render(); });
      chip.append(label, rm); box.append(chip);
    });
  }
  function closeResults(){ $(ids.results).classList.remove('open'); $(ids.results).textContent = ''; }
  function showResultsMessage(text){
    const box = $(ids.results);
    box.textContent = '';
    const d = document.createElement('div'); d.className = 'result empty'; d.textContent = text;
    box.append(d); box.classList.add('open');
  }
  function showResults(people){
    const box = $(ids.results);
    box.textContent = '';
    const fresh = people.filter((p) => !list.some((o) => o.email.toLowerCase() === p.email.toLowerCase()));
    if (!fresh.length) return showResultsMessage(t('ownersEmpty'));
    fresh.forEach((p) => {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'result';
      const nm = document.createElement('span'); nm.className = 'rname'; nm.textContent = p.name;
      const em = document.createElement('span'); em.className = 'remail'; em.textContent = p.email;
      btn.append(nm, em);
      btn.addEventListener('click', () => {
        const dup = otherList.findIndex((o) => o.email.toLowerCase() === p.email.toLowerCase());
        if (dup >= 0) otherList.splice(dup, 1);
        list.push(p); renderChips();
        $(ids.input).value = ''; closeResults(); $(ids.input).focus();
      });
      box.append(btn);
    });
    box.classList.add('open');
  }
  let debounce;
  async function onInput(){
    const q = $(ids.input).value.trim();
    clearTimeout(debounce);
    if (q.length < 2) return closeResults();
    showResultsMessage(t('ownersSearching'));
    const mySeq = ++seq;
    debounce = setTimeout(async () => {
      if (!window.api) return;
      if (!(await askConsent())) return closeResults();
      let res = await window.api.searchPeople(q);
      if (!res.ok && res.auth) {
        setMsg('signin');
        if (!(await doLogin())) { clearMsg(); return showResultsMessage(t('ownersAuth')); }
        clearMsg();
        res = await window.api.searchPeople(q);
      }
      if (mySeq !== seq) return; // a newer query superseded this one
      if (!res.ok) return showResultsMessage(res.error || t('ownersEmpty'));
      showResults(res.people || []);
    }, 250);
  }
  $(ids.input).addEventListener('input', onInput);
  document.addEventListener('click', (e) => { if (!e.target.closest('.' + ids.field)) closeResults(); });
  return { render, closeResults };
}

// Looks up entries with no URL by group ID, every 10s while provisioning.
// Fills in the URL when ready, removes the entry when the group is gone.
const pendingChecked = new Set();
function resolvePending(entry){
  if (entry.url || !entry.groupId || pendingChecked.has(entry.groupId) || !window.api) return;
  pendingChecked.add(entry.groupId);
  (async () => {
    const res = await window.api.siteStatus({ groupId: entry.groupId });
    if (!res.ok) return;
    const list = loadHistory();
    if (res.status === 2 && res.url) list.forEach((e) => { if (e.groupId === entry.groupId) e.url = res.url; });
    else if (res.gone) list.splice(0, list.length, ...list.filter((e) => e.groupId !== entry.groupId));
    else {
      if (res.status === 1) setTimeout(() => { pendingChecked.delete(entry.groupId); renderHistory(); }, 10000);
      return;
    }
    saveHistory(list);
    renderHistory();
  })();
}

// Ghost-site detection: drops stale "recent sites" entries whose site was deleted elsewhere.
// Map<normalizedUrl, 'checking' | 'exists' | 'gone' | 'error'>
const existsCache = new Map();
function ensureExists(url){

  if (!url || existsCache.has(key) || !window.api) return;
  existsCache.set(key, 'checking');
  (async () => {
    let res = await window.api.checkSiteExists({ siteUrl: url });
    if (!res.ok && res.auth) {
      if (!(await doLogin())) { existsCache.set(key, 'error'); renderHistory(); return; }
      res = await window.api.checkSiteExists({ siteUrl: url });
    }
    if (res.ok) existsCache.set(key, res.exists ? 'exists' : 'gone');
    else existsCache.set(key, 'error');
    renderHistory();
  })();

// Holds resolved sync-check results. In-flight checks are tracked separately in syncHeuristicInFlight.
// Map<normalizedUrl, boolean>
const syncHeuristicCache = new Map();
const syncHeuristicInFlight = new Set();
function ensureSyncHeuristic(url, num, title, alias, force){
  const key = normalizeUrl(url);
  if (!url || !window.api) return;
  if (!force && syncHeuristicCache.has(key)) return;
  if (syncHeuristicInFlight.has(key)) return;
  syncHeuristicInFlight.add(key);
  (async () => {
    const res = await window.api.checkSynced({ siteUrl: url, num, title, alias });
    syncHeuristicInFlight.delete(key);
    const next = !!(res.ok && res.synced);
    const changed = syncHeuristicCache.get(key) !== next;
    syncHeuristicCache.set(key, next);
    if (changed) renderHistory();
  })();
}

// Compares "1.0.6-alpha" style versions. A release ranks above its prereleases.
function compareVersions(a, b){
  const parse = (v) => { const [n, pre] = String(v || '').split('-'); return { n: n.split('.').map((x) => parseInt(x, 10) || 0), pre: pre || '' }; };
  const A = parse(a), B = parse(b);
  for (let i = 0; i < 3; i++) if ((A.n[i] || 0) !== (B.n[i] || 0)) return (A.n[i] || 0) - (B.n[i] || 0);
  if (A.pre === B.pre) return 0;
  if (!A.pre) return 1;
  if (!B.pre) return -1;
  return A.pre.localeCompare(B.pre, undefined, { numeric: true });
}
let adminData = null; // { rows, latestVersion } or { error }
function renderInstalls(){
  const body = $('adminTable').tBodies[0]; body.textContent = '';
  if (!adminData) return;
  if (adminData.error) { $('adminStatus').textContent = t('adminFail') + adminData.error; $('adminStatus').className = 'hist-meta err'; return; }
  const rows = adminData.rows.slice();
  // Latest GitHub release, or the newest reported version if GitHub was unreachable.
  const latest = adminData.latestVersion || rows.reduce((m, r) => compareVersions(r.version, m) > 0 ? r.version : m, '');
  rows.sort((a, b) => compareVersions(b.version, a.version) || String(b.lastSeen).localeCompare(String(a.lastSeen)));
  const old = rows.filter((r) => compareVersions(r.version, latest) < 0).length;
  $('adminStatus').className = 'hist-meta';
  $('adminStatus').textContent = rows.length ? t('adminSummary').replace('{n}', rows.length).replace('{o}', old).replace('{v}', latest) : t('adminEmpty');
  rows.forEach((r) => {
    const tr = document.createElement('tr');
    const seen = r.lastSeen ? new Date(r.lastSeen).toLocaleString(lang() === 'fr' ? 'fr-CA' : 'en-CA', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    [r.name, r.email, r.role, r.computer, r.version, seen].forEach((v, i) => {
      const td = document.createElement('td'); td.textContent = v;
      if (i === 4 && compareVersions(r.version, latest) < 0) td.className = 'old';
      tr.append(td);
    });
    body.append(tr);
  });
}

}
function setSort(v){
  histSort = v;
  try { localStorage.setItem('histSort', v); } catch {}
  renderHistory();
}
function openSortMenu(){
  $('histSortMenu').classList.add('open'); $('histSort').setAttribute('aria-expanded', 'true');
  const sel = $('histSortMenu').querySelector('[aria-selected=true]'); if (sel) sel.focus();
}
function closeSortMenu(){ $('histSortMenu').classList.remove('open'); $('histSort').setAttribute('aria-expanded', 'false'); }
$('histSort').addEventListener('click', () => $('histSortMenu').classList.contains('open') ? closeSortMenu() : openSortMenu());
$('histSortMenu').addEventListener('keydown', (e) => {
  const opts = [...$('histSortMenu').querySelectorAll('.dd-opt')];
  const i = opts.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); opts[(i + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length].focus(); }
  else if (e.key === 'Escape') { closeSortMenu(); $('histSort').focus(); }
  else if (e.key === 'Tab') closeSortMenu();
});
document.addEventListener('click', (e) => { if (!e.target.closest('.dd')) closeSortMenu(); });

// Pinned sites first, then by name in the chosen direction.
function sortSites(list){
  const dir = histSort === 'desc' ? -1 : 1;
  return list.slice().sort((a, b) => {
    const pa = pinned.has(normalizeUrl(a.url)), pb = pinned.has(normalizeUrl(b.url));
    if (pa !== pb) return pa ? -1 : 1;
    return dir * (a.displayName || '').localeCompare(b.displayName || '', lang(), { numeric: true, sensitivity: 'base' });
  });
}

function renderHistory(){
  renderSortButton();
  // Dedupes by URL, keeping the first occurrence.
  const seenUrls = new Set();
  const own = loadHistory().filter((e) => {
    const key = normalizeUrl(e.url);
    if (!key || seenUrls.has(key)) return !key; // keep entries with no url (pending creates) as-is
    seenUrls.add(key);
    return true;
  });
  const ownUrls = new Set(own.map((e) => normalizeUrl(e.url)));
  // "recent sites" entries have no known creation date (alias shown instead).
  const extra = (recentSites || [])
    .filter((s) => !ownUrls.has(normalizeUrl(s.url)))
    .map((s) => ({ displayName: s.title || aliasFromUrl(s.url), alias: aliasFromUrl(s.url), url: s.url, date: null }));
  const list = sortSites(own.concat(extra));
  lastRenderedList = list;

  $('histEmpty').style.display = list.length ? 'none' : '';
  const box = $('histList'); box.textContent = '';
  list.forEach((e) => {
    const item = document.createElement('div'); item.className = 'hist-item';
    const main = document.createElement('div'); main.className = 'hist-main';
    const title = document.createElement('div'); title.className = 'hist-title'; title.textContent = e.displayName;
    const meta = document.createElement('div'); meta.className = 'hist-meta';

    resolvePending(e);
    ensureExists(e.url);
    ensureSyncHeuristic(e.url, e.num, e.displayName, e.alias);
    const key = normalizeUrl(e.url);

    // Shows the alias, never a timestamp.
    meta.textContent = e.alias;
    main.append(title, meta);

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:6px;align-items:center';
    if (existsCache.get(key) === 'gone') {
      // Drops a confirmed-gone (404) site from the list.
      removeHistory(e.url);
      return;
    }
    if (key) {
      const isPinned = pinned.has(key);
      const pinBtn = iconButton('pin' + (isPinned ? ' on' : ''), ICON_PIN, t(isPinned ? 'unpin' : 'pin'), () => togglePin(key));
      pinBtn.setAttribute('aria-pressed', String(isPinned));
      actions.append(pinBtn);
    }

    const heuristicSynced = syncHeuristicCache.get(key);
    const isSynced = heuristicSynced === true;
    // Button stays hidden until the sync check resolves.
    const checkSettled = heuristicSynced === true || heuristicSynced === false;

    if (!isSynced && checkSettled) {
      actions.append(iconButton('sync', ICON_SYNC, t('syncTitle'), async () => {
        if (!window.api) return;
        const res = await window.api.syncSite({ siteUrl: e.url });
        if (!res.ok) return setMsg('syncFailed', { error: res.error });
        // Retries the sync check a few times.
        setMsg('syncLaunched');
        [4000, 10000, 20000].forEach((delay) => setTimeout(() => {
          syncHeuristicCache.delete(key);
          renderHistory();
        }, delay));
      }));
    }

    const openBtn = document.createElement('button'); openBtn.type = 'button'; openBtn.className = 'hist-open';
    if (e.url) { openBtn.textContent = t('histOpen'); openBtn.addEventListener('click', () => window.api && window.api.open(e.url)); }
    else { openBtn.textContent = t('histPending'); openBtn.disabled = true; }
    actions.append(openBtn);

    item.append(main, actions); box.append(item);
  });
}

// ---------- submit ----------
async function submit(e){
  e.preventDefault();
  if (!window.api) return setMsg('noApi', { cls: 'err' });
  const n = names();
  if (!/^\d{3}$/.test(n.num)) return setMsg('errNum', { cls: 'err' });
  if (!n.title) return setMsg('errTitle', { cls: 'err' });
  if (!cleanTitle(n.title)) return setMsg('errAlias', { cls: 'err' });
  $('go').disabled = true; applyLang(); clearMsg();
  const ownerEmails = owners.map((o) => o.email);
  // Skips members who are also owners.
  const ownerSet = new Set(ownerEmails.map((e) => e.toLowerCase()));
  const memberList = members
    .filter((m) => !ownerSet.has(m.email.toLowerCase()))
    .map((m) => ({ email: m.email, key: m.key || '' }));
  try {
    if (!(await askConsent())) return setMsg('signinFail', { cls: 'err' });
    let res = await window.api.create({ displayName: n.displayName, alias: n.alias, owners: ownerEmails });
    if (!res.ok && res.auth) {
      setMsg('signin');
      if (!(await doLogin())) return setMsg('signinFail', { cls: 'err' });
      res = await window.api.create({ displayName: n.displayName, alias: n.alias, owners: ownerEmails });
    }
    if (!res.ok) return setMsg('failed', { error: res.error });
    if (res.status === 4) return setMsg('exists', { cls: 'err' });
    if (res.status === 3 || res.status === 0) return setMsg('failed', { error: 'SiteStatus ' + res.status });
    addHistory({ num: n.num, title: n.title, displayName: n.displayName, alias: n.alias, url: res.url || '', groupId: res.groupId || '', date: new Date().toISOString() });
    setMsg('success', { prov: res.status === 1, url: res.url });
    teamifyInBackground(res.url);
    addMembersAfterCreate(res.url, res.groupId, memberList);
    owners.length = 0; owners.push(...DEFAULT_OWNERS.map((o) => ({ ...o })));
    members.length = 0;
    renderChips();
  } finally { $('go').disabled = false; applyLang(); }
}

$('num').addEventListener('input', () => { $('num').value = $('num').value.replace(/\D/g, '').slice(0, 3); preview(); });
$('ttl').addEventListener('input', preview);
$('f').addEventListener('submit', submit);
$('gear').addEventListener('click', () => { const o = $('settings').classList.toggle('open'); $('gear').setAttribute('aria-expanded', o); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('settings').classList.remove('open'); closeAllResults(); $('consentDecline').click(); } });
$('lang').addEventListener('change', (e) => { langPref = e.target.value; store.set('lang', langPref); applyLang(); });
$('theme').addEventListener('change', (e) => { themePref = e.target.value; store.set('theme', themePref); applyTheme(); });

$('lang').value = langPref; $('theme').value = themePref;
applyTheme(); applyLang(); preview(); renderChips(); renderHistory();

// ---------- startup: ask consent right away, then sign in ----------
// Pops up a sign-in window only if the stored session has expired.
(async () => {
  if (!window.api) return; // noApi message is only relevant once the user tries to act
  if (!(await askConsent())) return;
  setMsg('signin');
  const check = await window.api.checkAuth();
  if (!check.ok && !(await doLogin())) { setMsg('signinFail', { cls: 'err' }); return; }
  clearMsg();
  resolveDefaultOwnerNames();
  startInstallReporting();
  if (wideLayout.matches) { recheckAllSynced(); ensureRecentSites(); } // Sites panel is already visible
})();
</script>
